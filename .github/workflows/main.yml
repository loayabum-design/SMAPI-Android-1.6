name: Build Patcher DLL

on:
  push:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List Directory Structure
        run: |
          echo "=== All Directories ==="
          find . -maxdepth 3 -not -path '*/.*'
